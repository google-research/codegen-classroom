name: Publish to PyPI via OSS Exit Gate

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  publish:
    name: Build and stage Python distribution to OSS Exit Gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build and Artifact Registry tools
        run: |
          python -m pip install --upgrade pip build twine keyring keyrings.google-artifactregistry-auth

      - name: Build wheel and sdist
        run: python -m build

      - name: Authenticate with OSS Exit Gate GCP Project (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github"

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Upload package to OSS Exit Gate Artifact Registry
        run: |
          twine upload --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/codegen-classroom--pypi dist/*

      - name: Trigger OSS Exit Gate publishing
        run: |
          cat << 'EOF' > publish_all.json
          {
            "publish_all": true
          }
          EOF
          gcloud storage cp publish_all.json gs://oss-exit-gate-prod-projects-bucket/codegen-classroom/pypi/manifests/publish_all.json
