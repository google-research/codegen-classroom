[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codegen-classroom"
version = "0.1.1"
description = "A framework for iterative code generation and recursive self-improvement (RSI) on ML and data analysis tasks using parallel LLM agents, optimized for local and Colab deployments."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Google LLC"},
    {name = "Jake Garrison", email = "jakegarrison@google.com"},
]
keywords = [
    "machine-learning",
    "automated-research",
    "autoresearch",
    "self-improvement",
    "recursive-self-improvement",
    "rsi",
    "code-generation",
    "llm-agents",
    "multi-agent",
    "automl",
    "gemini",
    "gemma",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "google-genai",
    "httpx",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "scipy",
    "etils[epath]",
    "absl-py",
    "python-dotenv",
    "pillow",
    "pyarrow",
]

[project.optional-dependencies]
notebook = [
    "plotly",
    "ipython",
    "rich",
]
torch = [
    "torch",
    "torchvision",
]
jax = [
    "jax",
]
lightgbm = [
    "lightgbm",
]
dev = [
    "pytest",
    "pytest-mock",
]
all = [
    "plotly",
    "ipython",
    "rich",
    "torch",
    "torchvision",
    "jax",
    "lightgbm",
    "pytest",
    "pytest-mock",
]


[project.urls]
Homepage = "https://github.com/google-research/codegen-classroom"
Repository = "https://github.com/google-research/codegen-classroom"
Issues = "https://github.com/google-research/codegen-classroom/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["codegen_classroom*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.tsv", "*.csv", "*.md", "*.ipynb", "*.txt"]
